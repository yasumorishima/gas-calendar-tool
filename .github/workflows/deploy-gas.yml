name: Deploy to Google Apps Script

# main に Code.gs / Index.html / appsscript.json の変更が入ったら、
# 既存のWebアプリURLのまま新バージョンでデプロイする
on:
  push:
    branches: [main]
    paths:
      - Code.gs
      - Index.html
      - appsscript.json
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

env:
  # WebアプリURL https://script.google.com/macros/s/<これ>/exec
  DEPLOYMENT_ID: AKfycbxMSGHa3--q4Q6Iw6aJNSfbJ0XvJmUpOt_8wfYduVGP69NLd6Mh-Fo7SkemPobMQSo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON が設定されていません"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push code
        run: clasp push -f

      - name: Update web app deployment
        run: clasp update-deployment "$DEPLOYMENT_ID" -d "gas-calendar-tool main ${GITHUB_SHA::7}"
